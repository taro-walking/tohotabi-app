<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字化けを防ぐための文字コード指定です -->
  <meta charset="UTF-8">
  <!-- iPhoneの画面幅に合わせる重要な設定です -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- ブラウザに古い画面を記憶させないキャッシュ対策です -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- ホーム画面から開いた時にアプリ風にするiPhone専用設定です -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="徒歩旅">
  <!-- iPhoneのホーム画面に表示する専用アイコンの指定です -->
  <link rel="apple-touch-icon" href="icon.png?v=20261123g">
  <!-- アプリ全体の設定ファイル（manifest.json）を読み込みます -->
  <link rel="manifest" href="manifest.json?v=20261123g">
  <!-- ブラウザのタブやホーム画面に表示されるタイトルです -->
  <title>徒歩旅 - マイ・ウォーキング旅</title>
  <!-- 画面デザイン用ファイル（style.css）を読み込みます -->
  <link rel="stylesheet" href="style.css?v=20261123g">
</head>
<body>

  <!-- アプリ全体の枠組みです -->
  <div class="app-container">

    <!-- 画面上部のヘッダー部分です -->
    <header class="app-header">
      <!-- アプリのタイトルを表示します -->
      <h1>🚶 マイ・ウォーキング旅</h1>
      <!-- 現在選択中のコース名を表示する場所です -->
      <p id="header-course-name" class="course-subtitle">コース読み込み中...</p>
    </header>

    <!-- 3つの画面を切り替えるタブメニューボタンです -->
    <nav class="tab-nav">
      <!-- 1つ目：メインの記録・現在地画面へ切り替えるボタンです -->
      <button class="tab-btn active" data-target="tab-home">📍 記録・現在地</button>
      <!-- 2つ目：通過した街の観光情報や歩数グラフを見る画面へ切り替えるボタンです -->
      <button class="tab-btn" data-target="tab-history">📊 旅の記録・グラフ</button>
      <!-- 3つ目：コース変更や歩幅を設定する画面へ切り替えるボタンです -->
      <button class="tab-btn" data-target="tab-settings">⚙️ 設定</button>
    </nav>

    <!-- ========================================== -->
    <!-- 【画面1】記録・現在地タブ（初期表示）      -->
    <!-- ========================================== -->
    <main id="tab-home" class="tab-content active">

      <!-- 励ましメッセージを表示する目立つカードです -->
      <section class="card message-card">
        <p id="encouragement-msg">今日も一歩ずつ進みましょう！</p>
      </section>

      <!-- 現在の到達地点と観光・物産情報、地図を表示するカードです -->
      <section class="card status-card">
        <h2>現在の到達地点</h2>
        <!-- 到達した市町村名を大きく表示します -->
        <div id="latest-point-name" class="highlight-title">---</div>
        <!-- 累計距離と累計歩数を並べて表示します -->
        <div class="stats-row">
          <div class="stat-box">
            <span class="stat-label">累計距離</span>
            <span id="total-km" class="stat-value">0 km</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">累計歩数</span>
            <span id="total-steps" class="stat-value">0 歩</span>
          </div>
        </div>
        <!-- その街の名所と特産品、地域の話題を表示する枠です -->
        <div class="spot-info">
          <p><strong>🏯 名所：</strong><span id="latest-spot">---</span></p>
          <p><strong>🍱 特産：</strong><span id="latest-specialty">---</span></p>
          <p id="latest-topic-row" style="display: none;">
            <strong>📰 話題：</strong><span id="latest-topic">---</span>
          </p>
        </div>
        <!-- 拡大縮小・スクロール・ピンタップができる地図を表示する枠です -->
        <div id="route-map" class="route-map-box"></div>
      </section>

      <!-- 日々の歩数を手入力するカードです（横幅いっぱいの縦並び構成） -->
      <section class="card input-card">
        <h2>歩数を記録する</h2>
        <!-- 1段目：枠の中に「2026/11/22（日）」と直接表示する日付入力欄です -->
        <div class="form-group">
          <label for="input-date">日付</label>
          <div style="position: relative; width: 100%; height: 46px;">
            <!-- 画面に見える「2026/11/22（日）」表示用の枠です -->
            <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 1rem; border: 1px solid #cccccc; border-radius: 8px; background-color: #ffffff; pointer-events: none;">
              <span id="input-date-display">2026/11/22（日）</span>
              <span>📅</span>
            </div>
            <!-- 透明にして上に重ねる本物の日付入力部品です -->
            <input type="date" id="input-date" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;">
          </div>
        </div>
        <!-- 2段目：歩数を数字で入力する欄です -->
        <div class="form-group">
          <label for="input-steps">歩数（歩）</label>
          <input type="number" id="input-steps" inputmode="numeric" placeholder="例: 8000">
        </div>
        <!-- 3段目：記録を保存する実行ボタンです -->
        <button id="btn-add-steps" class="primary-btn">この歩数を記録する</button>
      </section>

    </main>

    <!-- ========================================== -->
    <!-- 【画面2】旅の記録・グラフタブ              -->
    <!-- ========================================== -->
    <section id="tab-history" class="tab-content">
      <!-- 歩数推移を期間別（日・週・月・半年）に棒グラフ表示するカードです -->
      <div class="card">
        <h2 id="chart-title">歩数グラフ（日別・直近7日）</h2>
        <!-- グラフの表示期間を切り替える4つのボタンです -->
        <div style="display: flex; gap: 6px; margin-bottom: 10px;">
          <button type="button" class="chart-mode-btn" data-mode="day" style="flex: 1; padding: 6px 2px; font-size: 0.78rem; font-weight: bold; border-radius: 6px; border: 1px solid #2e6f40; background: #2e6f40; color: #ffffff; cursor: pointer;">日別(7日)</button>
          <button type="button" class="chart-mode-btn" data-mode="week" style="flex: 1; padding: 6px 2px; font-size: 0.78rem; font-weight: bold; border-radius: 6px; border: 1px solid #cccccc; background: #ffffff; color: #333333; cursor: pointer;">週別(7週)</button>
          <button type="button" class="chart-mode-btn" data-mode="month" style="flex: 1; padding: 6px 2px; font-size: 0.78rem; font-weight: bold; border-radius: 6px; border: 1px solid #cccccc; background: #ffffff; color: #333333; cursor: pointer;">月別(6ヶ月)</button>
          <button type="button" class="chart-mode-btn" data-mode="half" style="flex: 1; padding: 6px 2px; font-size: 0.78rem; font-weight: bold; border-radius: 6px; border: 1px solid #cccccc; background: #ffffff; color: #333333; cursor: pointer;">半年別</button>
        </div>
        <!-- JavaScriptで棒グラフを自動生成して入れる場所です -->
        <div id="step-chart" class="chart-container">
          <p class="empty-text">まだ記録がありません</p>
        </div>
      </div>

      <!-- コース内の全地点と到達状況・到達日付けの一覧を表示するカードです -->
      <div class="card">
        <h2>コース通過チェックリスト</h2>
        <!-- JavaScriptで地点リストを自動生成して入れる場所です -->
        <ul id="point-list" class="point-list"></ul>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- 【画面3】設定タブ                          -->
    <!-- ========================================== -->
    <section id="tab-settings" class="tab-content">
      <div class="card">
        <h2>コースと歩幅の設定</h2>
        <!-- コースから選ぶプルダウンメニューです -->
        <div class="form-group">
          <label for="select-course">歩くコースを選択</label>
          <select id="select-course"></select>
        </div>
        <!-- 自分の歩幅（cm）を入力する欄です -->
        <div class="form-group">
          <label for="input-stride">あなたの歩幅（cm）</label>
          <input type="number" id="input-stride" inputmode="numeric" value="70">
          <small class="help-text">※目安：身長(cm) × 0.45（例：160cmなら約72cm）</small>
        </div>
        <!-- 設定を保存するボタンです -->
        <button id="btn-save-settings" class="primary-btn">設定を保存する</button>
      </div>

      <!-- データのバックアップ保存・復元・初期化を行うカードです -->
      <div class="card danger-card">
        <h2>データ管理（更新・保存・初期化）</h2>
        <!-- iPhoneで古い画面が残った時に強制的に最新版を読み込むボタンです -->
        <button type="button" onclick="location.href=location.pathname+'?t='+Date.now();" style="width: 100%; padding: 12px; margin-bottom: 10px; background-color: #eef6ff; color: #005bb5; border: 1px solid #005bb5; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer;">
          🔄 アプリを最新版に更新（再読込）
        </button>
        <!-- 現在の歩数記録をJSONファイルに保存するボタンです -->
        <button type="button" id="btn-export-data" class="primary-btn" style="margin-bottom: 10px;">
          💾 データをファイルに保存（バックアップ）
        </button>
        <!-- 保存したJSONファイルから復元するボタンです -->
        <button type="button" id="btn-import-data" style="width: 100%; padding: 12px; margin-bottom: 14px; background-color: #f4faf6; color: #2e6f40; border: 1px solid #2e6f40; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer;">
          📂 バックアップファイルから復元
        </button>
        <!-- ファイル選択ダイアログ用の隠れた入力部品です -->
        <input type="file" id="input-import-file" accept=".json,application/json" style="display: none;">
        <!-- データをすべて消去する初期化ボタンです -->
        <button type="button" id="btn-reset-data" class="danger-btn">すべての記録をリセットする</button>
      </div>
    </section>

  </div>

  <!-- 1-1. コース1（三陸ルート）の個別データを読み込みます -->
  <script src="course1.js?v=20261123g"></script>
  <!-- 1-2. コース2（東海道五十三次）の個別データを読み込みます -->
  <script src="course2.js?v=20261123g"></script>
  <!-- 1-3. 各コースデータをまとめる目次（master.js）を読み込みます -->
  <script src="master.js?v=20261123g"></script>
  <!-- 2. 保存データ管理を読み込みます -->
  <script src="storage.js?v=20261123g"></script>
  <!-- 3. 計算・位置判定を読み込みます -->
  <script src="logic.js?v=20261123g"></script>
  <!-- 4. 画面表示の更新担当を読み込みます -->
  <script src="ui.js?v=20261123g"></script>
  <!-- 4.4 座標計算専用モジュールを読み込みます -->
  <script src="map-calc.js?v=20261123g"></script>
  <!-- 4.5 地図HTML生成モジュールを読み込みます -->
  <script src="map-html.js?v=20261123g"></script>
  <!-- 4.6 地図描画・操作モジュールを読み込みます -->
  <script src="map.js?v=20261123g"></script>
  <!-- 5. メイン制御を読み込みます -->
  <script src="main.js?v=20261123g"></script>
</body>
</html>
<!-- --- index.html ここまで --- -->
