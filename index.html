<!-- このファイルが最新のHTML（HTML5）であることをブラウザに伝える宣言です -->
<!DOCTYPE html>
<!-- Webページ全体の始まりと、主な言語が日本語（ja）であることを指定します -->
<html lang="ja">
<!-- 画面には直接見えない、ページの設定情報（裏方の設定）をまとめる場所です -->
<head>
  <!-- 日本語の文字化けを防ぐため、文字コードを「UTF-8」に指定します -->
  <meta charset="UTF-8">
  <!-- iPhone 17などのスマホ画面の幅にピッタリ合わせて、文字が小さくならないようにする最重要設定です -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Safariのタブや、iPhoneの「ホーム画面に追加」をした時に表示されるアプリ名です -->
  <title>徒歩旅（仮）</title>
<!-- 裏方の設定（head）の終わりです -->
</head>
<!-- ここから下が、実際にiPhoneの画面に表示される中身（表舞台）です -->
<body>
  <!-- 一番大きな見出し（タイトル）として「徒歩旅（仮）」を画面に表示します -->
  <h1>徒歩旅（仮）</h1>
  <!-- 普通の文章（段落）として、動作確認用のメッセージを表示します -->
  <p>iPhone 17 での表示テスト成功です！</p>
  <!-- もう1行、次のステップへの準備メッセージを改行して表示します -->
  <p>ここから歩く旅が始まります。</p>
<!-- 画面に表示される中身（body）の終わりです -->
</body>
<!-- Webページ全体の終わりです -->
</html>
