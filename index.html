<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字化けを防ぐための文字コード指定です -->
  <meta charset="UTF-8">
  <!-- iPhoneの画面幅に合わせる重要な設定です -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- ホーム画面から開いた時にアプリ風にするiPhone専用設定です -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- ブラウザのタブやホーム画面に表示されるタイトルです -->
  <title>マイ・ウォーキング旅</title>
  <!-- 画面デザイン用ファイル（style.css）を読み込みます -->
  <link rel="stylesheet" href="style.css?v=20261122b">
</head>
<body>

  <!-- アプリ全体の枠組みです -->
  <div class="app-container">

    <!-- 画面上部のヘッダー部分です -->
    <header class="app-header">
      <!-- アプリのタイトルを表示します -->
      <h1>🚶 マイ・ウォーキング旅</h1>
      <!-- 現在選択中のコース名を表示する場所です -->
      <p id="header-course-name" class="course-subtitle">コース読み込み中...</p>
    </header>

    <!-- 3つの画面を切り替えるタブメニューボタンです -->
    <nav class="tab-nav">
      <!-- 1つ目：メインの記録・現在地画面へ切り替えるボタンです -->
      <button class="tab-btn active" data-target="tab-home">📍 記録・現在地</button>
      <!-- 2つ目：通過した街の観光情報や歩数グラフを見る画面へ切り替えるボタンです -->
      <button class="tab-btn" data-target="tab-history">📊 旅の記録・グラフ</button>
      <!-- 3つ目：コース変更や歩幅を設定する画面へ切り替えるボタンです -->
      <button class="tab-btn" data-target="tab-settings">⚙️ 設定</button>
    </nav>

    <!-- ========================================== -->
    <!-- 【画面1】記録・現在地タブ（初期表示）      -->
    <!-- ========================================== -->
    <main id="tab-home" class="tab-content active">

      <!-- 励ましメッセージを表示する目立つカードです -->
      <section class="card message-card">
        <p id="encouragement-msg">今日も一歩ずつ進みましょう！</p>
      </section>

      <!-- 現在の到達地点と観光・物産情報、地図を表示するカードです -->
      <section class="card status-card">
        <h2>現在の到達地点</h2>
        <!-- 到達した市町村名を大きく表示します -->
        <div id="latest-point-name" class="highlight-title">---</div>
        <!-- 累計距離と累計歩数を並べて表示します -->
        <div class="stats-row">
          <div class="stat-box">
            <span class="stat-label">累計距離</span>
            <span id="total-km" class="stat-value">0 km</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">累計歩数</span>
            <span id="total-steps" class="stat-value">0 歩</span>
          </div>
        </div>
        <!-- その街の名所と特産品を表示する枠です -->
        <div class="spot-info">
          <p><strong>🏯 名所：</strong><span id="latest-spot">---</span></p>
          <p><strong>🍱 特産：</strong><span id="latest-specialty">---</span></p>
        </div>
        <!-- 拡大縮小・ピンタップができる地図を表示する枠です -->
        <div id="route-map" class="route-map-box"></div>
      </section>

      <!-- 日々の歩数を手入力するカードです（確実に見える2段構成） -->
      <section class="card input-card">
        <h2>歩数を記録する</h2>
        <!-- 1段目：日付を選ぶ入力欄です -->
        <div class="form-group">
          <label for="input-date">日付</label>
          <input type="date" id="input-date">
        </div>
        <!-- 2段目：歩数入力と記録ボタンを並べて押しやすくします -->
        <div class="form-group">
          <label for="input-steps">歩数（歩）</label>
          <div class="steps-input-row">
            <input type="number" id="input-steps" inputmode="numeric" placeholder="例: 8000">
            <button id="btn-add-steps" class="primary-btn steps-submit-btn">記録する</button>
          </div>
        </div>
      </section>

    </main>

    <!-- ========================================== -->
    <!-- 【画面2】旅の記録・グラフタブ              -->
    <!-- ========================================== -->
    <section id="tab-history" class="tab-content">
      <!-- 直近7日間の歩数を棒グラフで表示するカードです -->
      <div class="card">
        <h2>日別歩数グラフ（直近7日）</h2>
        <!-- JavaScriptで棒グラフを自動生成して入れる場所です -->
        <div id="step-chart" class="chart-container">
          <p class="empty-text">まだ記録がありません</p>
        </div>
      </div>

      <!-- コース内の全地点と到達状況の一覧を表示するカードです -->
      <div class="card">
        <h2>コース通過チェックリスト</h2>
        <!-- JavaScriptで地点リストを自動生成して入れる場所です -->
        <ul id="point-list" class="point-list"></ul>
      </div>
    </section>

    <!-- ========================================== -->
    <!-- 【画面3】設定タブ                          -->
    <!-- ========================================== -->
    <section id="tab-settings" class="tab-content">
      <div class="card">
        <h2>コースと歩幅の設定</h2>
        <!-- 3つのコースから選ぶプルダウンメニューです -->
        <div class="form-group">
          <label for="select-course">歩くコースを選択</label>
          <select id="select-course"></select>
        </div>
        <!-- 自分の歩幅（cm）を入力する欄です -->
        <div class="form-group">
          <label for="input-stride">あなたの歩幅（cm）</label>
          <input type="number" id="input-stride" inputmode="numeric" value="70">
          <small class="help-text">※目安：身長(cm) × 0.45（例：160cmなら約72cm）</small>
        </div>
        <!-- 設定を保存するボタンです -->
        <button id="btn-save-settings" class="primary-btn">設定を保存する</button>
      </div>

      <!-- データを初期化する危険操作用のカードです -->
      <div class="card danger-card">
        <h2>データ管理</h2>
        <button id="btn-reset-data" class="danger-btn">すべての記録をリセットする</button>
      </div>
    </section>

  </div>

  <!-- 1. 市町村マスターデータを読み込みます -->
  <script src="master.js?v=20261122b"></script>
  <!-- 2. 保存データ管理を読み込みます -->
  <script src="storage.js?v=20261122b"></script>
  <!-- 3. 計算・位置判定を読み込みます -->
  <script src="logic.js?v=20261122b"></script>
  <!-- 4. 画面表示の更新担当を読み込みます -->
  <script src="ui.js?v=20261122b"></script>
  <!-- 4.4 座標計算専用モジュールを読み込みます -->
  <script src="map-calc.js?v=20261122b"></script>
  <!-- 4.5 地図描画モジュールを読み込みます -->
  <script src="map.js?v=20261122b"></script>
  <!-- 5. メイン制御を読み込みます -->
  <script src="main.js?v=20261122b"></script>
</body>
</html>
