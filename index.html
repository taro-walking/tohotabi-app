<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>徒歩旅 動作確認テスト</title>
</head>
<body>
  <!-- 画面の見出しを表示します -->
  <h1>徒歩旅（仮）動作テスト</h1>
  
  <!-- テスト結果の文字を流し込むための「空の箱」を用意します -->
  <div id="test-area"></div>

  <!-- 1. 前回作ったマスターデータを読み込みます -->
  <script src="master.js"></script>
  
  <!-- 2. 今回作った保存管理プログラムを読み込みます -->
  <script src="storage.js"></script>

  <!-- 3. ここから動作確認用のテストプログラムを実行します -->
  <script>
    // テスト用に一旦データをリセットします
    StorageManager.clearAllData();
    
    // 「2026-11-21 に 5000歩 歩いた」というデータを保存します
    StorageManager.addStepRecord('2026-11-21', 5000);
    
    // さらに「2026-11-21 に 3000歩 追加で歩いた」というデータを保存します
    StorageManager.addStepRecord('2026-11-21', 3000);
    
    // 保存されたデータを読み込みます（合計 8000歩 になるはずです）
    const testResult = StorageManager.loadData();
    
    // 画面の「空の箱（test-area）」を取得します
    const area = document.getElementById('test-area');
    
    // 箱の中にテスト結果のメッセージを表示します
    area.innerHTML = '<p>【保存テスト成功】累計歩数：' + testResult.totalSteps + '歩（記録件数：' + testResult.history.length + '件）</p>';
  </script>
</body>
</html>
